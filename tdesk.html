<title>Tournament desk</title>
<!--
  One page, two tabs, no scrolling:
    Markets    order book (or chart) per team in a groups x teams grid; click a price to trade it
    Positions  position, average price, market value, MTM P&L, theo / PA editing, hedges
  Data: GET /api/state every 0.5 s, GET /api/history (charts) every 2 s while a chart is open.
-->
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--card2:#1c2230;--line:#2a3140;--ink:#e6edf3;--mut:#8b949e;--acc:#58a6ff;
  --bid:#3fb950;--ask:#f85149;--warn:#d29922;--hit:#ffd400;--cross:rgba(121,192,255,.28);--mine:#d2a8ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:12px/1.35 system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column;padding:0 8px 6px}
button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
input,select{background:#0b0f15;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font:inherit}
input[type=number]{width:56px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.pos{color:var(--bid)}.neg{color:var(--ask)}
/* top bar */
#bar{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:nowrap;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid #fff;border-radius:5px;background:none;color:var(--ink);font-weight:600;padding:3px 12px}
.tabs button.act{background:var(--acc);border-color:var(--acc);color:#0d1117}
/* on/off switch */
.switch{position:relative;display:inline-block;width:34px;height:18px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#484f58;border-radius:9px;transition:.15s;cursor:pointer}
.slider::before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.slider{background:#238636}
.switch input:checked+.slider::before{transform:translateX(16px)}
/* Swiss record: plain text by the name; the square's border shows it red (losing) .. green (winning) */
.rec{font-weight:800;font-size:11px;white-space:nowrap}
.cell.recb{border:2px solid var(--rc)}
/* pots: one outline around all the teams in a pot, until the first result is in */
#grid{position:relative}
.potline{position:absolute;pointer-events:none;z-index:4}
.potlbl{position:absolute;pointer-events:none;z-index:5;font-size:10px;font-weight:800;padding:0 5px;border-radius:3px;color:#0d1117;transform:translateY(-55%)}
/* bottom line: record colour key + minimised markets */
#foot{display:flex;align-items:center;gap:14px;padding-top:6px;flex-wrap:wrap}
#foot[hidden]{display:none}
.legend{display:flex;align-items:center;gap:4px;font-size:11px}
.legend span.sw{display:inline-block;padding:0 6px;border-radius:3px;border:2px solid;font-weight:700}
/* the two qualifiers share a square until one of them wins */
.cell.half .mrow{flex-direction:column}
.cell.half .side{border-left:none;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;justify-content:center}
.cell.half .ft input,.cell.half .ft button{display:none}
.grp{display:flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.spin{display:inline-flex;align-items:center;gap:2px}
.spin button{padding:0 5px;line-height:16px}
.spin span{min-width:20px;text-align:center;font-weight:700}
.on,.go{background:#238636!important;border-color:#2ea043!important;color:#fff!important;font-weight:700}
.stop{background:#b62324!important;border-color:#f85149!important;color:#fff!important;font-weight:700}
.offb{background:#30363d}
.xb{color:#f85149!important;font-weight:900;border-color:#f8514966!important}
#tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#tray[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1px 4px 1px 10px;opacity:.75}
.chip button{border-radius:10px;padding:0 6px}
.amber{background:#5a4300!important;border-color:var(--warn)!important;color:#ffd77a!important;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
#err{color:var(--ask);font-weight:600;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
/* grid */
#grid{flex:1;min-height:0;display:grid;gap:6px}
.colh{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;cursor:grab;padding:0 4px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:border-color .15s}
.cell.flash{border:2px solid var(--hit)!important;box-shadow:0 0 0 2px rgba(255,212,0,.35)}
.cell.done{opacity:.42;filter:grayscale(.8)}
.cell.dragover{outline:2px dashed var(--acc)}
.hd{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--card2)}
.hd .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.hd .rk{color:var(--mut);font-size:11px}
.hd .sp{flex:1}
.hd button{padding:0 6px;font-size:11px}
.bd{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.ft{display:flex;align-items:center;gap:6px;padding:3px 6px;border-top:1px solid var(--line)}
.ft input{width:84px;padding:3px 6px;font-size:13px;font-weight:700}
.ft input.mb{border-color:#2ea04388}.ft input.ma{border-color:#f8514988}
.ft button{padding:2px 10px;font-size:12px}
.fv{display:flex;gap:10px;padding:2px 6px;font-size:12px}
.fv b{font-weight:700}
/* book */
table.bk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bk td{padding:1px 6px;text-align:right;border-bottom:1px solid #1f2633}
.bk td.px{cursor:pointer;font-weight:700}
.bk td.b{color:var(--bid)}.bk td.a{color:var(--ask);text-align:left}
.bk td.qa{text-align:left}
.bk td.px:hover{background:#26324a}
.bk td.x{background:var(--cross)}
.bk .me{color:var(--mine);font-size:10px}
/* the ladder on the Markets tab */
.bk.lad{table-layout:fixed;max-width:460px}
.bk.lad th:nth-child(1),.bk.lad th:nth-child(6){width:27%}
.bk.lad th:nth-child(2),.bk.lad th:nth-child(5){width:9%}
.bk.lad th:nth-child(3),.bk.lad th:nth-child(4){width:14%}
.bk.lad td{padding:2px 4px;overflow:hidden}
.bk.lad td.who{text-align:left;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk.lad td.who.a{text-align:right}
.bk.lad td.who.me{color:var(--mine);font-weight:700}
.bk.lad th.r{text-align:right}
.bk.lad td.px.b{color:var(--bid);text-align:right;border-right:1px solid var(--line)}
.bk.lad td.px.a{color:var(--ask);text-align:left}
.bk.lad td.px.none{cursor:default}
.bk.lad td.px.none:first-child,.bk.lad tr.a td:nth-child(3){border-right:1px solid var(--line)}
.bk.lad tr.a td:nth-child(n+4){background:#2a141433}.bk.lad tr.b td:nth-child(-n+3){background:#12261a33}
.bk.lad tr.mid td{text-align:center;font-size:10px;padding:0;border-bottom:1px solid var(--line)}
.bk.lad tr td.px.x{background:var(--cross)}
.bk th{color:var(--mut);font-weight:500;font-size:10px;text-align:right;padding:0 6px}
.bk th.l{text-align:left}
.note{color:var(--mut);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
canvas.ch{flex:1;min-height:0;width:100%;display:block;cursor:crosshair}
.lg{display:flex;gap:8px;font-size:10px;color:var(--mut);padding:1px 6px}
.lg i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:3px}
.tip{position:absolute;pointer-events:none;background:#0b0f15ee;border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:11px;white-space:nowrap;z-index:3}
/* steppers: fair / pos-adj - fair / edge, on the side of each market and on top in positions */
.mrow{flex:1;min-height:0;display:flex}
.mrow .bd{flex:1;min-width:0}
.side{display:flex;flex-direction:column;gap:3px;padding:3px 5px;border-left:1px solid var(--line);align-items:stretch;justify-content:flex-start}
.side .stp{flex-direction:row;gap:2px}
.side .stp button{width:36px;line-height:20px}
.side .stp input{width:58px}
.side .stp .cap{text-align:left;max-width:none;width:84px;padding-left:3px;line-height:1.1}
.stp{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stp button{width:58px;padding:0;line-height:14px;font-size:10px}
.stp input{width:58px;text-align:center;font-weight:700;font-size:13px;padding:1px 2px}
.stp .cap{font-size:10px;color:var(--mut);text-align:center;line-height:1.15;max-width:70px}
.stp.ed input{border-color:var(--warn);color:#ffd77a}
/* positions */
.pz{display:flex;gap:10px;padding:5px 6px 2px;justify-content:center}
.pz .stp button{width:72px}.pz .stp input{width:72px;font-size:15px}.pz .stp .cap{max-width:90px}
.kv{padding:3px 6px;font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.kv span.k{color:var(--mut)}
.kv>span.it{white-space:nowrap}
.kv b{font-weight:700}
.kv i{font-style:normal;color:var(--line);padding:0 4px}
.hg{padding:2px 6px 4px;font-size:11px;font-variant-numeric:tabular-nums}
/* top of book at the bottom of each position square: click to trade it, or to cancel it if it's ours */
.tob{display:flex;gap:6px;padding:4px 6px;border-top:1px solid var(--line);margin-top:auto;font-variant-numeric:tabular-nums}
.tob .px{flex:1;text-align:center;cursor:pointer;border-radius:4px;padding:2px 4px;font-weight:700;border:1px solid transparent}
.tob .px.b{color:var(--bid);background:#12261a}.tob .px.a{color:var(--ask);background:#2a1414}
.tob .px:hover{border-color:var(--acc)}
.tob .px.mine{border:2px solid var(--mine)}
.tob .px.none{color:var(--mut);background:none;cursor:default}
.tob .px small{font-weight:500;color:var(--mut)}
.hg div{display:flex;gap:6px;cursor:pointer;border-radius:3px;padding:0 3px}
.hg div:hover{background:#26324a}
.hg .e{margin-left:auto;font-weight:700}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(1400px,96vw);height:min(820px,92vh);display:flex;flex-direction:column}
.mhd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.mbd{flex:1;min-height:0;overflow:auto;padding:12px}
.mft{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line)}
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
.cell.half .hd{flex-wrap:wrap;gap:3px;padding:3px 4px}
.cell.half .hd .rk .pt,.cell.half .hd .rk .mut{display:none}
.setup h3,.swiss h3,.qual h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.srow{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.srow input.nm{flex:1;min-width:0}
.srow input.rg{width:42px}
.srow select{width:112px}
.seed{display:inline-flex;align-items:center;gap:1px}
.seed button{padding:0 4px;line-height:16px;font-size:10px}
.seed input{width:44px;text-align:center;font-weight:700}
.seed.ed input{border-color:var(--warn);color:#ffd77a}
.qual{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card2)}
.swiss{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bucket{border:1px solid var(--line);border-radius:6px;padding:5px;margin-bottom:8px;background:var(--card2)}
.bucket .bh{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.tchips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.tchip{display:inline-flex;gap:3px;align-items:center;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.tchip.used{opacity:.4}
.mline{display:flex;align-items:center;gap:4px;font-size:12px;padding:1px 0}
.mline .w{color:var(--bid);font-weight:700}.mline .l{color:var(--mut)}
.mline button{padding:0 5px;font-size:10px;margin-left:auto}
.addm{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:3px}
.addm select{max-width:46%;font-size:11px}
.addm button{padding:0 6px;font-size:11px}
.ko{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:calc(100% - 30px)}
.kwrap{display:flex;flex-direction:column;min-height:0}
.kwrap h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.kwrap .kcol{flex:1}
.kcol{display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.kcol h3{margin:0;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.km{border:1px solid var(--line);border-radius:6px;background:var(--card2)}
.km .lb{font-size:10px;color:var(--mut);padding:1px 6px}
.km .tm{display:flex;align-items:center;gap:6px;padding:3px 6px;border-top:1px solid var(--line);cursor:pointer}
.km .tm span{flex:1;font-weight:600}
.km .tm.w{background:#173d24}
.km .tm.w span::after{content:"  ✓";color:var(--bid)}
.km .tm.tbd span{color:var(--mut);font-weight:400;font-style:italic}
.km input{width:38px;text-align:center}
.sets{display:grid;grid-template-columns:auto auto;gap:6px 12px;align-items:center;max-width:520px}
.sets label{color:var(--mut)}
#toast{position:fixed;right:12px;bottom:12px;background:#21262d;color:var(--ink);border:1px solid var(--line);padding:7px 11px;border-radius:6px;display:none;max-width:460px;z-index:30}
</style>

<div id="bar">
  <span class="dot" id="apidot" title="exchange connection"></span>
  <input id="market" placeholder="market id" style="width:120px" title="market id or link">
  <button onclick="loadMarket()">Load</button>
  <div class="tabs"><button id="tabMk" class="act" onclick="setTab('mk')">Markets</button><button id="tabPos" onclick="setTab('pos')">Position management</button></div>
  <div class="grp" title="Market-making requirement: quote no wider than this spread in this many markets">
    MM ≤ <span class="spin"><button onclick="bump('rebateWidth',-0.1,0.1)">▼</button><input id="mmW" type="number" step="0.1" style="width:46px" onchange="setCtl({rebateWidth:+this.value})"><button onclick="bump('rebateWidth',0.1)">▲</button></span>
    in <span class="spin"><button onclick="bump('nTight',-1)">▼</button><span id="mmN">-</span><button onclick="bump('nTight',1)">▲</button></span>
    <span id="mmNow" class="mut"></span><span id="narrow" class="mut" title="after each result every market starts wide and narrows to the MM spread"></span>
    <button onclick="snapEdge()" title="set the MM-requirement markets to exactly this spread now">snap to edge</button>
  </div>
  <div class="grp" title="Auto-deflection: after we're traded on, keep quoting with the position-adjusted fair moved by this much of our edge per share, this many times (or until the position limit) - then that market switches off">
    <label class="switch"><input type="checkbox" id="adSw" onchange="setCtl({autoDefl:this.checked})"><span class="slider"></span></label> deflect
    <span class="spin"><button onclick="bump('deflPct',-0.1)">▼</button><span id="dpct">-</span><button onclick="bump('deflPct',0.1)">▲</button></span>
    × <span class="spin"><button onclick="bump('deflCount',-1,1)">▼</button><span id="dcnt">-</span><button onclick="bump('deflCount',1)">▲</button></span>
  </div>
  <div class="grp" title="fair = (1 - w) × the market mid + w × our fair (where someone else quotes both sides; otherwise our fair)">
    ours <span class="spin"><button onclick="bump('ourShare',-0.1,0,1)">▼</button><span id="oshare">-</span><button onclick="bump('ourShare',0.1,0,1)">▲</button></span></div>
  <div class="grp" title="Max position per market (each market can have its own in Position management)">max pos <span class="spin"><button onclick="bump('maxPos',-1)">▼</button><span id="mpos">-</span><button onclick="bump('maxPos',1)">▲</button></span></div>
  <div class="grp" title="Lots per click-trade">qty <span class="spin"><button onclick="bump('clickQty',-1,1)">▼</button><span id="qty">1</span><button onclick="bump('clickQty',1,1)">▲</button></span></div>
  <span>P&amp;L <b id="pnl" class="num">-</b></span>
  <span id="err"></span>
  <span style="flex:1"></span>
  <button onclick="openResults()">Add result</button>
  <button onclick="openSettings()" title="Settings">⚙</button>
  <button id="allBtn" onclick="toggleAll()">Turn Quotes On</button>
</div>
<div id="grid"></div>
<div id="foot" hidden><div class="legend" id="legend"></div><div id="tray" hidden></div></div>
<div id="modal" hidden><div class="mbox"><div class="mhd" id="mhd"></div><div class="mbd" id="mbd"></div><div class="mft" id="mft"></div></div></div>
<div id="toast"></div>

<script>
const TOKEN = "__TRADE_TOKEN__";
let S = null, TAB = localStorage.getItem("tdTab") || "mk", HIST = {}, CHART = {}, ZOOM = {}, SEEN = null, BUILT = "";
const $ = id => document.getElementById(id);
const f2 = x => x == null || isNaN(x) ? "–" : (+x).toFixed(2);
const sg = x => x == null ? "–" : (x > 0 ? "+" : "") + x;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const abbr = t => String(t || "?").replace(/[^A-Za-z0-9]/g, "").slice(0, 3).toUpperCase();
const ord = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

function toast(m, ms = 3500) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms); }
async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Trade-Token": TOKEN}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok: false, reason: "HTTP " + r.status}));
  if (!j.ok) toast(j.reason || "failed");
  return j;
}
async function setCtl(set) { const j = await post("/api/controls", {set}); if (j.ok && S) S.controls = j.controls; refresh(); return j; }
function loadMarket() { let v = $("market").value.trim(); const m = v.match(/\/m\/([^/?#]+)/); if (m) v = m[1]; setCtl({market: v}); }
function bump(k, d, min = 0, max = Infinity) { if (!S) return; setCtl({[k]: Math.min(max, Math.max(min, Math.round(((S.controls[k] || 0) + d) * 100) / 100))}); }
function toggleAll() { if (!S) return; const on = !S.controls.quoting; post("/api/allquotes", {on}).then(j => j.ok && toast(on ? "Quotes on in every market" : "Quotes off: everything pulled")); }
function setTab(t) { TAB = t; localStorage.setItem("tdTab", t); BUILT = ""; render(); }
const row = team => S.rows.find(r => r.team === team);

// --- trading clicks ---
function trade(team, side, price) {
  const r = row(team); if (!r || !r.iid) return;
  const q = S.controls.clickQty || 1;
  post("/api/order", {iid: r.iid, side, price, qty: q}).then(j => j.ok && toast(`${side === "bid" ? "BUY" : "SELL"} ${q} ${team} @ ${f2(price)}: filled ${j.filled}`));
}
function manual(team) {
  const r = row(team), c = cellOf(team); if (!r) return;
  const b = c.querySelector(".mb").value, a = c.querySelector(".ma").value;
  post("/api/quote", {iid: r.iid, bid: b, ask: a, qty: S.controls.clickQty || 1}).then(j => { if (j.ok) { toast(`posted ${team} ${b || "-"} / ${a || "-"}`); c.querySelector(".mb").value = c.querySelector(".ma").value = ""; } });
}
function quoteBtn(team) {
  const r = row(team); if (!r) return;
  const on = r.off || r.blocked.length;          // off, or a side traded on -> back on (both sides)
  post("/api/pull", {team, off: !on});
}
function setTheo(team, kind, value) { return post("/api/theo", {team, kind, value}).then(refresh); }
function snapEdge() { post("/api/snap", {}).then(j => j.ok && toast(`${j.n} MM-requirement markets set to exactly ${S.controls.rebateWidth} wide`)); }
// Swiss record colour: losing red .. winning green; through = full green, out = full red
function recColor(x) {
  if (!x) return "#8b949e";
  if (x.status === "adv") return "hsl(120,70%,45%)";
  if (x.status === "out") return "hsl(0,75%,55%)";
  return `hsl(${Math.max(0, Math.min(120, 60 + (x.w - x.l) * 30))},70%,52%)`;
}
const recBadge = x => !x ? "" : x.status === "qual" ? `<span class="rec mut" title="plays the qualifier">qual</span>`
  : `<span class="rec num" title="Swiss record: wins-losses">${x.w}-${x.l}</span>`;
const POT = {1: ["Tier 1", "#e3b341"], 2: ["Tier 2", "#9fb3c8"], 3: ["Tier 3", "#c9773e"], Q: ["Qualifier", "#a371f7"]};
// the colour key at the bottom: what each record colour means
function legendHTML() {
  const items = [["0-2", {w: 0, l: 2}], ["0-1 · 1-2", {w: 0, l: 1}], ["0-0 · 1-1 · 2-2", {w: 0, l: 0}], ["1-0 · 2-1", {w: 1, l: 0}], ["2-0", {w: 2, l: 0}],
                 ["3-x through", {status: "adv"}], ["x-3 out", {status: "out"}]];
  return `<span class="mut">record:</span>` + items.map(([lab, x]) => `<span class="sw" style="border-color:${recColor({status: "swiss", ...x})}">${lab}</span>`).join("");
}
// one outline around each group of squares: the pots until the first result is in; in the knockout,
// the two teams of each match (drawn over the grid)
const KO_GROUP = {QF1: ["QF1 · 3-1 v 3-1", "#58a6ff"], QF2: ["QF2 · 3-2 v 3-0", "#3fb950"], QF3: ["QF3 · 3-1 v 3-2", "#d29922"],
                  QF4: ["QF4 · 3-0 v 3-2", "#db61a2"], SF1: ["Semi-final 1", "#58a6ff"], SF2: ["Semi-final 2", "#d29922"], F: ["Grand Final", "#e3b341"]};
function drawPots() {
  const g = $("grid");
  g.querySelectorAll(".potline,.potlbl").forEach(x => x.remove());
  const ko = !!koPlacement(), groups = ko ? KO_GROUP : POT;
  if (!ko && Object.keys(S.state.results || {}).length) return;
  const gr = g.getBoundingClientRect(), half = 3, slots = {};
  for (const el of g.querySelectorAll(".cell")) {
    const r = row(el.dataset.team); if (!r) continue;
    const key = ko ? el.dataset.m : String(r.tier);
    if (!key || !groups[key]) continue;
    const k = el.dataset.slot, b = el.getBoundingClientRect(), s = slots[k];
    const box = {l: b.left - gr.left - half, t: b.top - gr.top - half, r: b.right - gr.left + half, b: b.bottom - gr.top + half};
    slots[k] = s ? {...s, l: Math.min(s.l, box.l), r: Math.max(s.r, box.r)} : {...box, pot: key, c: +el.dataset.c, rw: +el.dataset.r};
  }
  const at = (c, rw) => slots[`${c},${rw}`];
  let h = "";
  const firsts = {};
  for (const s of Object.values(slots)) {
    const col = (groups[s.pot] || ["", "#888"])[1], line = (x, y, w, ht) => `<div class="potline" style="left:${x}px;top:${y}px;width:${w}px;height:${ht}px;background:${col}"></div>`;
    if ((at(s.c, s.rw - 1) || {}).pot !== s.pot) h += line(s.l, s.t - 1, s.r - s.l, 2);
    if ((at(s.c, s.rw + 1) || {}).pot !== s.pot) h += line(s.l, s.b - 1, s.r - s.l, 2);
    if ((at(s.c - 1, s.rw) || {}).pot !== s.pot) h += line(s.l - 1, s.t, 2, s.b - s.t);
    if ((at(s.c + 1, s.rw) || {}).pot !== s.pot) h += line(s.r - 1, s.t, 2, s.b - s.t);
    const f = firsts[s.pot];
    if (!f || s.rw < f.rw || (s.rw === f.rw && s.c < f.c)) firsts[s.pot] = s;
  }
  for (const [p, s] of Object.entries(firsts)) h += `<div class="potlbl" style="left:${s.l + 8}px;top:${s.t}px;background:${groups[p][1]}">${groups[p][0]}</div>`;
  g.insertAdjacentHTML("beforeend", h);
}
function hideTeam(team, hidden) { BUILT = ""; post("/api/hide", {team, hidden}).then(refresh); }
function resetTeam(team) { setTheo(team, "theo", null).then(() => setTheo(team, "pa", null)).then(() => setTheo(team, "edge", null)); }

// steppers. Markets: our fair, the exact position-adjusted fair ("adj"), edge. Position management:
// our fair, the GAP pos-adj fair - fair, edge, max position. ▲▼ (0.1, max pos 1) or type a value.
const KINDS = ["theo", "pa", "edge"], KINDS_POS = ["theo", "diff", "edge", "maxpos"];
const STEP = {maxpos: 1};
const kval = (r, k) => k === "theo" ? r.our : k === "pa" ? r.pa : k === "diff" ? r.pa - r.theo : k === "maxpos" ? r.maxPos : r.edge;
function stepper(J, k) {
  const s = STEP[k] || 0.1;
  return `<div class="stp s-${k}"><button onclick='stepK(${J},"${k}",${s})'>▲ ${s}</button>
    <input class="num" onkeydown="if(event.key==='Enter')this.blur()" onchange='sendK(${J},"${k}",parseFloat(this.value))'>
    <button onclick='stepK(${J},"${k}",-${s})'>▼ ${s}</button><span class="cap"></span></div>`;
}
function sendK(team, k, v) {
  const r = row(team); if (!r || isNaN(v)) return;
  v = Math.round(v * 100) / 100;
  if (k === "theo") setTheo(team, "theo", v);
  else if (k === "pa") setTheo(team, "pa", v);
  else if (k === "diff") setTheo(team, "pa", r.theo + v);          // moves PA only, keeping fair where it is
  else if (k === "maxpos") setTheo(team, "maxpos", Math.max(0, Math.round(v)));
  else setTheo(team, "edge", Math.max(0, v));
}
function stepK(team, k, d) { const r = row(team), v = r && kval(r, k); if (v != null) sendK(team, k, v + d); }
function renderSteppers(el, r) {
  const ed = {theo: r.theoEdited, pa: r.paEdited, diff: r.paEdited, edge: r.edgeEdited, maxpos: r.maxPosEdited};
  const cap = {theo: "Fair", pa: "adj", diff: `Pos-adj fair <b>${f2(r.pa)}</b>`, edge: "Edge", maxpos: "Max pos"};
  const tip = {theo: `our fair (model ${f2(r.base)}). Moves the fair, pos-adj fair and every correlated team. Dropped when a result comes in.`,
               pa: "position-adjusted fair (what we quote around). Moves it only - and correlated teams' - not the fair",
               diff: "pos-adj fair minus fair: moves the position-adjusted fair only (and correlated teams' pos-adj fairs)",
               edge: "edge we charge each side of the position-adjusted fair (half our width). Edited: overrides the wide-then-narrow schedule until the next result",
               maxpos: "this market's max position (the global one is at the top)"};
  for (const k of TAB === "mk" ? KINDS : KINDS_POS) {
    const s = el.querySelector(".s-" + k); if (!s) continue;
    const inp = s.querySelector("input"), v = kval(r, k);
    if (document.activeElement !== inp) inp.value = v == null ? "" : k === "maxpos" ? v : (k === "diff" && v > 0 ? "+" : "") + f2(v);
    s.classList.toggle("ed", !!ed[k]);
    s.querySelector(".cap").innerHTML = cap[k]; s.title = tip[k];
    s.querySelectorAll("button,input").forEach(x => x.disabled = k !== "maxpos" && (r.known || (k === "edge" && v == null)));
  }
}

// --- layout: a 4 x 4 grid in seed order (drag a name onto another team to move it) ---
function order() {
  const t = S.state.teams, want = (S.controls.layout || {}).order;
  return Array.isArray(want) && want.length === t.length && t.every(x => want.includes(x)) ? want : t;
}
let DRAG = null;
function onDragStart(e, kind, key) { DRAG = {kind, key}; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", key); }
function onDrop(e, kind, key) {
  e.preventDefault(); document.querySelectorAll(".dragover").forEach(x => x.classList.remove("dragover"));
  if (!DRAG || DRAG.key === key || DRAG.kind !== "team" || kind !== "team") return;
  const o = order().filter(x => x !== DRAG.key);
  o.splice(order().indexOf(key), 0, DRAG.key);
  DRAG = null; BUILT = ""; setCtl({layout: {order: o}});
}
const cellOf = team => document.querySelector(`.cell[data-team="${CSS.escape(team)}"]`);

// where each visible team goes: 4 across, as few rows as hold the teams still on screen (so every
// time a whole row's worth is minimised the rest get bigger). The two qualifiers share one square
// while both are still in; the loser is minimised as soon as their result is in.
// knockout: the teams still in, laid out as the bracket. Quarter-finals: 4 quadrants, each match's two
// teams side by side (QF1, QF2 on top - they meet in SF1; QF3, QF4 below). Semis: SF1's pair on top,
// SF2's below. Final: one finalist on top, one below. Everyone else is in the bottom bar.
function koPlacement() {
  const fx = S.fixtures;
  if (!fx || !fx.swissDone) return null;
  const K = Object.fromEntries(fx.ko.map(k => [k.id, k]));
  const pair = id => K[id] && K[id].a && K[id].b ? [{t: K[id].a, m: id}, {t: K[id].b, m: id}] : null;
  let rows;
  if (pair("F")) rows = [[pair("F")[0]], [pair("F")[1]]];
  else if (pair("SF1") && pair("SF2")) rows = [pair("SF1"), pair("SF2")];
  else if (["QF1", "QF2", "QF3", "QF4"].every(pair)) rows = [[...pair("QF1"), ...pair("QF2")], [...pair("QF3"), ...pair("QF4")]];
  else {                                                        // drawn but not entered yet: the 8 by record
    const adv = ["3-0", "3-1", "3-2"].flatMap(k => (fx.pools[k] || []).map(t => ({t, m: ""})));
    rows = [adv.slice(0, 4), adv.slice(4, 8)];
  }
  const cols = Math.max(...rows.map(r => r.length));
  return {ko: true, cols, rows: rows.length,
          cells: rows.flatMap((r, ri) => r.map((x, ci) => ({t: x.t, m: x.m, col: `${ci * 2 + 1} / span 2`, row: ri + 1, c: ci})))};
}
function placement() {
  const ko = koPlacement();
  if (ko) return ko;
  const hid = new Set(S.controls.hidden || []), tier = S.state.tiers || {};
  const vis = order().filter(t => !hid.has(t));
  const qs = vis.filter(t => tier[t] === "Q");
  const slots = [];
  for (const t of vis) {
    if (qs.length === 2 && t === qs[1]) continue;
    slots.push(qs.length === 2 && t === qs[0] ? qs : [t]);
  }
  const V = slots.length, cols = V <= 1 ? 1 : V <= 4 ? 2 : V <= 6 ? 3 : 4, rows = Math.max(1, Math.ceil(V / cols));
  const cells = [];
  slots.forEach((s, i) => {
    const c = i % cols, r = Math.floor(i / cols) + 1;
    if (s.length === 2) s.forEach((t, k) => cells.push({t, col: `${c * 2 + 1 + k} / span 1`, row: r, half: true, c}));
    else cells.push({t: s[0], col: `${c * 2 + 1} / span 2`, row: r, c});
  });
  return {cols, rows, cells};
}
function build() {
  const P = placement(), g = $("grid");
  g.style.gridTemplateColumns = `repeat(${P.cols * 2}, minmax(0,1fr))`;
  g.style.gridTemplateRows = `repeat(${P.rows}, minmax(0,1fr))`;
  let h = "";
  for (const {t, col, row: ri, half, c, m} of P.cells) {
    const T = esc(t), J = esc(JSON.stringify(t)), pos = `grid-column:${col};grid-row:${ri}`;
    const dnd = `ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop='onDrop(event,"team",${J})'`;
    const hd = `<div class="hd"><span class="nm" draggable="true" ondragstart='onDragStart(event,"team",${J})' title="drag onto another team to move it there">${T}</span><span class="rk"></span><span class="sp"></span>`;
    const tail = `<button class="rs" title="undo this team's fair, pos-adj and edge edits" onclick='resetTeam(${J})'>↺</button><button class="xb" title="settled: minimise to the bottom bar" onclick='hideTeam(${J},true)'>✕</button>`;
    if (TAB === "mk") h += `<div class="cell${half ? " half" : ""}" data-team="${T}" data-slot="${c},${ri}" data-m="${m || ""}" data-c="${c}" data-r="${ri}" style="${pos}" ${dnd}>
      ${hd}<button class="cb" onclick='toggleChart(${J})'>chart</button><button class="qb" onclick='quoteBtn(${J})'>-</button>${tail}</div>
      <div class="mrow"><div class="bd"></div><div class="side">${KINDS.map(k => stepper(J, k)).join("")}</div></div>
      <div class="fv num"></div>
      <div class="ft"><span class="ps num"></span><span class="note"></span>
        <input class="mb" placeholder="bid" onkeydown='if(event.key==="Enter")manual(${J})'><input class="ma" placeholder="offer" onkeydown='if(event.key==="Enter")manual(${J})'><button onclick='manual(${J})' title="or press Enter in either box">post</button></div></div>`;
    else h += `<div class="cell${half ? " half" : ""}" data-team="${T}" data-slot="${c},${ri}" data-m="${m || ""}" data-c="${c}" data-r="${ri}" style="${pos}" ${dnd}>
      ${hd}<span class="rg mut num"></span>${tail}</div>
      <div class="pz">${KINDS_POS.map(k => stepper(J, k)).join("")}</div>
      <div class="kv"></div>
      <div class="ot note" style="padding:0 6px;font-size:11px"></div><div class="hg"></div><div class="tob"></div></div>`;
  }
  g.innerHTML = h;
  const placed = new Set(P.cells.map(x => x.t)), userHid = new Set(S.controls.hidden || []);
  const hid = S.rows.map(r => r.team).filter(t => !placed.has(t));        // minimised, or out of the bracket
  $("tray").hidden = !hid.length;
  $("tray").innerHTML = `<span class="mut">${P.ko ? "out of the bracket / minimised" : "minimised"}:</span>` + hid.map(t => { const r = row(t), J = esc(JSON.stringify(t));
    return `<span class="chip">${esc(t)} <span class="mut num">${r ? f2(r.theo) : ""}</span>${userHid.has(t) && !P.ko ? `<button title="maximise: back on the screen" onclick='hideTeam(${J},false)'>⤢</button>` : ""}</span>`; }).join("");
  if (TAB === "mk") for (const t of Object.keys(CHART)) if (CHART[t]) mountChart(t);
}

// --- render ---
function render() {
  if (!S) return;
  const c = S.controls;
  $("apidot").style.background = S.api.read ? "var(--bid)" : (c.market ? "var(--ask)" : "var(--mut)");
  $("apidot").title = (S.trading ? "LIVE (can trade)" : "view only") + " · " + (S.market ? `${S.market} · ${S.status}` : "no market loaded");
  if (document.activeElement !== $("market")) $("market").value = c.market;
  $("tabMk").classList.toggle("act", TAB === "mk"); $("tabPos").classList.toggle("act", TAB === "pos");
  if (document.activeElement !== $("mmW")) $("mmW").value = c.rebateWidth;
  $("mmN").textContent = c.nTight; $("qty").textContent = c.clickQty; $("mpos").textContent = c.maxPos;
  $("dpct").textContent = Math.round(c.deflPct * 100) + "%"; $("dcnt").textContent = c.deflCount;
  $("oshare").textContent = Math.round(c.ourShare * 100) + "%";
  $("adSw").checked = !!c.autoDefl;
  $("mmNow").innerHTML = S.cover ? `<span class="${S.cover.within >= S.cover.need ? "pos" : "neg"}">now ${S.cover.within}/${S.cover.need}</span>` : "";
  $("narrow").textContent = S.narrowLeft > 0 ? ` ⏱${Math.floor(S.narrowLeft / 60)}:${String(Math.floor(S.narrowLeft % 60)).padStart(2, "0")}` : "";
  $("pnl").textContent = f2(S.totalPnl); $("pnl").className = "num " + (S.totalPnl >= 0 ? "pos" : "neg");
  $("err").textContent = S.error || (S.mappingProblems.length && c.market ? "⚠ " + S.mappingProblems[0] : "");
  const all = $("allBtn"); all.textContent = c.quoting ? "Turn Quotes Off" : "Turn Quotes On"; all.className = c.quoting ? "stop" : "go";
  all.title = c.quoting ? "pull every quote in every market" : "quote every market (re-enables any pulled ones)";
  const sig = TAB + JSON.stringify(placement()) + S.state.teams.join();
  if (sig !== BUILT) { BUILT = sig; build(); }
  const swiss = S.stage === "qualifier" || S.stage === "swiss", pots = !Object.keys(S.state.results || {}).length;
  $("legend").innerHTML = swiss && !pots ? legendHTML() : "";
  $("foot").hidden = $("tray").hidden && !(swiss && !pots);
  for (const r of S.rows) {
    const el = cellOf(r.team); if (!el) continue;
    el.classList.toggle("done", r.settled);
    const rc = swiss && !pots && r.rec && r.rec.status !== "qual";        // record colour on the square's border
    el.classList.toggle("recb", !!rc);
    if (rc) el.style.setProperty("--rc", recColor(r.rec));
    el.querySelector(".xb").style.display = r.settled ? "" : "none";
    el.querySelector(".rs").style.display = r.theoEdited || r.paEdited || r.edgeEdited ? "" : "none";
    el.querySelector(".rk").innerHTML = (swiss ? recBadge(r.rec) : "")
      + ` <span class="mut" title="region, rank in region">${esc(r.region || "")}${r.rank ? " #" + r.rank : ""}</span>`;
    renderSteppers(el, r);
    if (TAB === "mk") renderMarket(el, r); else renderPos(el, r);
  }
  drawPots();
  flashHits();
}

function renderMarket(el, r) {
  const qb = el.querySelector(".qb");
  if (!r.iid) { qb.textContent = "no contract"; qb.disabled = true; qb.className = "qb"; }
  else {
    qb.disabled = false;
    if (r.blocked.length) { qb.textContent = r.blocked.length === 2 && r.hits ? `start quoting (${r.hits} hit${r.hits > 1 ? "s" : ""})` : `start quoting (${r.blocked.join("+")} off)`; qb.className = "qb go";
      qb.title = r.blocked.length === 2 ? "switched off after being traded on (deflection count or position limit). Click to quote again - the count starts again" : "that side is off (we were traded on, or our order there was cancelled). Click to quote both sides again"; }
    else if (r.off) { qb.textContent = "start quoting"; qb.className = "qb go"; qb.title = "quote this market again"; }
    else { qb.textContent = "pull quotes"; qb.className = "qb stop"; qb.title = S.controls.quoting ? "pull our quotes in this market" : "quotes are off everywhere (top right); this market will quote when they're turned on"; }
  }
  const cb = el.querySelector(".cb"); cb.textContent = CHART[r.team] ? "order book" : "chart";
  el.querySelector(".fv").innerHTML = r.known
    ? `<span>known value <b>${f2(r.theo)}</b></span><span class="mut">quoted ±0.10</span>`
    : `<span title="(1 - w) × market mid + w × our fair, w = ours % in the top bar"><span class="mut">fair</span> <b>${f2(r.theo)}</b>${r.mktMid != null ? ` <span class="mut">(ours ${f2(r.our)} ${Math.round(S.controls.ourShare * 100)}% · mkt ${f2(r.mktMid)} ${100 - Math.round(S.controls.ourShare * 100)}%)</span>` : ""}</span>
       <span><span class="mut">pos-adj</span> <b>${f2(r.pa)}</b></span>${r.width != null ? `<span class="mut" title="copy: inside the other market makers' top of book, copying it; own: our own market">${r.mode} · ${f2(r.width)} wide${r.edgeEdited ? " (edge set)" : ""}</span>` : ""}`;
  el.querySelector(".ps").innerHTML = `pos <b class="${r.pos > 0 ? "pos" : r.pos < 0 ? "neg" : ""}">${sg(r.pos)}</b>` + (r.avg != null ? ` <span class="mut">@ ${f2(r.avg)}</span>` : "");
  el.querySelector(".note").textContent = r.iid ? (r.note || (r.tight ? "MM requirement market" : "")) : "map a contract in Add result → Setup";
  el.querySelector(".note").title = r.note || "";
  for (const [cls, w] of [[".mb", "bid"], [".ma", "offer"]]) {             // the fat-finger range on the typing boxes
    const inp = el.querySelector(cls);
    inp.placeholder = r.iid ? `${r.fatLo.toFixed(1)}–${r.fatHi.toFixed(1)}` : w;
    inp.title = `manual ${w} (qty = top-bar qty). Fat-finger guard: must be within ${f2(r.fatLo)} – ${f2(r.fatHi)} (fair ± ${Math.round(S.controls.fatPct * 100)}% or ${S.controls.fatMin} points)`;
  }
  if (CHART[r.team]) { drawChart(r.team); return; }
  const bd = el.querySelector(".bd");
  if (!r.iid) { bd.innerHTML = `<div class="mut" style="margin:auto">no contract mapped</div>`; return; }
  // order book ladder: bids on the left, offers on the right; offers on the upper rows (best nearest the
  // middle), bids on the lower rows - bid prices bottom-left, offer prices top-right; who is behind each level
  const J = esc(JSON.stringify(r.team));
  const half = (l, side) => {                                  // who | qty | price  (offers: price | qty | who)
    if (!l) return side === "b" ? `<td class="who"></td><td class="q"></td><td class="px none"></td>` : `<td class="px none"></td><td class="q"></td><td class="who"></td>`;
    const [px, qty, mine, who] = l;
    const cross = !r.known && qty > mine && (side === "a" ? px < r.pa - 1e-9 : px > r.pa + 1e-9) ? " x" : "";
    const w = `<td class="who ${side} ${mine ? "me" : ""}" title="${esc(who || "")}">${esc(who || "")}</td>`, q = `<td class="q">${qty}</td>`;
    const p = `<td class="px ${side}${cross}" title="click: ${side === "a" ? "BUY this offer" : "SELL into this bid"}" onclick='trade(${J},"${side === "a" ? "bid" : "ask"}",${px})'>${f2(px)}</td>`;
    return side === "b" ? w + q + p : p + q + w;
  };
  const blank = `<td class="who"></td><td class="q"></td><td class="px none"></td>`, blankR = `<td class="px none"></td><td class="q"></td><td class="who"></td>`;
  const spread = r.bids[0] && r.asks[0] ? f2(r.asks[0][0] - r.bids[0][0]) : "–";
  bd.innerHTML = `<table class="bk lad"><tr><th class="l">who</th><th>qty</th><th>bid</th><th class="l">offer</th><th class="l">qty</th><th class="r">who</th></tr>`
    + `<tr class="a">${blank}${half(r.asks[1], "a")}</tr><tr class="a">${blank}${half(r.asks[0], "a")}</tr>`
    + `<tr class="mid"><td colspan="6" class="mut">spread ${spread}</td></tr>`
    + `<tr class="b">${half(r.bids[0], "b")}${blankR}</tr><tr class="b">${half(r.bids[1], "b")}${blankR}</tr></table>`;
}

function renderPos(el, r) {
  el.querySelector(".rg").textContent = `range ${r.range[0]}–${r.range[1]}`;
  const mv = r.mktValue == null ? `<b class="mut">null</b>` : `<b>${f2(r.mktValue)}</b>`, dot = "<i>·</i>";
  el.querySelector(".kv").innerHTML = [
    `<span class="k">position:</span> <b class="${r.pos > 0 ? "pos" : r.pos < 0 ? "neg" : ""}">${r.iid ? sg(r.pos) : "no contract"}</b>`,

  const el = cellOf(team); if (!el) return;

  bd.innerHTML = `<div class="lg"><span><i style="background:var(--bid)"></i>bid</span><span><i style="background:var(--ask)"></i>offer</span><span><i style="background:#fff"></i>pos-adj fair</span><span>▲▼ ours</span><span>△▽ market</span></div><canvas class="ch" title="wheel: zoom · drag: pan · double-click: reset"></canvas><div class="tip" hidden></div>`;
  const cv = bd.querySelector("canvas");
  cv.onwheel = e => { e.preventDefault(); const z = view(team), x = xAt(cv, e.offsetX, z), k = e.deltaY > 0 ? 1.25 : 0.8;
    ZOOM[team] = {x0: x - (x - z.x0) * k, x1: x + (z.x1 - x) * k}; drawChart(team); };
  cv.onmousedown = e => { const z = view(team), w = cv.clientWidth - 46; let sx = e.clientX;
    const mv = ev => { const dx = (ev.clientX - sx) / w * (z.x1 - z.x0); ZOOM[team] = {x0: z.x0 - dx, x1: z.x1 - dx}; drawChart(team); };

const PADL = 6, PADR = 40, PADT = 6, PADB = 16;

  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const h = series(team), z = view(team), now = S.now, r = row(team);

  // y range from what's visible
  const vis = []; const inX = t => t >= z.x0 && t <= z.x1;
  const addStep = (arr, idx) => { let prev = null; for (const p of arr) { if (p[0] < z.x0) { prev = p; continue; } if (p[0] > z.x1) break; idx.forEach(i => p[i] != null && vis.push(p[i])); }
    if (prev) idx.forEach(i => prev[i] != null && vis.push(prev[i])); };
  addStep(h.tob, [1, 2]); addStep(h.pa, [1]); h.trades.forEach(p => inX(p[0]) && vis.push(p[1]));
  if (!vis.length && r) [r.pa, r.oBid, r.oAsk].forEach(v => v != null && vis.push(v));
  if (!vis.length) { g.fillStyle = "#8b949e"; g.fillText("no data yet", W / 2 - 25, H / 2); return; }
  let y0 = Math.min(...vis), y1 = Math.max(...vis); const pad = Math.max((y1 - y0) * 0.08, 0.5); y0 -= pad; y1 += pad;

    g.fillText(new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: (z.x1 - z.x0) < 600000 ? "2-digit" : undefined}), Math.max(0, Math.min(x - 18, W - PADR - 40)), H - 4); }

  const box = btn.closest(".addm"), a = box.querySelector(".sa").value, b = box.querySelector(".sb").value, r = +box.dataset.r;
  if (a === b) return toast("pick two different teams");
  saveResult(`S${r}:${a}-${b}`, {a, b, winner: side === "a" ? a : b, round: r});
}

// knockout: QF slots from the 3-0 / 3-1 / 3-2 pools, then the bracket
const KO_COLS = [["Quarter-finals", ["QF1", "QF2", "QF3", "QF4"]], ["Semi-finals", ["SF1", "SF2"]], ["Grand Final", ["F"]]];
const KO_NAME = {QF1: "QF1 · 3-1 v 3-1", QF2: "QF2 · 3-2 v 3-0", QF3: "QF3 · 3-1 v 3-2", QF4: "QF4 · 3-0 v 3-2", SF1: "SF1 · QF1 v QF2", SF2: "SF2 · QF3 v QF4", F: "Grand Final"};
function modalKO() {
  const fx = S.fixtures, ko = Object.fromEntries(fx.ko.map(k => [k.id, k]));
  const taken = new Set(fx.ko.filter(k => k.need && k.a).flatMap(k => [k.a, k.b]));
  const box = id => {
    const k = ko[id], r = k.res || {}, J = esc(JSON.stringify(id));
    let inner;
    if (r.winner) inner = [k.a || r.a, k.b || r.b].map(t => `<div class="tm ${t === r.winner ? "w" : ""}"><span>${tname(t)}</span></div>`).join("")
      + `<div class="tm" style="cursor:default"><button onclick='saveResult(${J},null)'>clear</button></div>`;
    else if (k.need && !(k.a && k.b)) {
      const pool = rec => (fx.pools[rec] || []).filter(t => !taken.has(t));
      inner = fx.swissDone ? `<div class="tm" style="cursor:default"><select class="ka">${pool(k.need[0]).map(t => `<option>${esc(t)}</option>`).join("")}</select>
            <select class="kb">${pool(k.need[1]).map((t, i) => `<option ${k.need[0] === k.need[1] && i === 1 ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
          <div class="tm" style="cursor:default"><button class="go" onclick='koPick(this,${J},"a")'>◀ won</button><button class="go" onclick='koPick(this,${J},"b")'>won ▶</button></div>`
        : `<div class="tm tbd"><span>${k.need[0]} team</span></div><div class="tm tbd"><span>${k.need[1]} team</span></div>`;
    } else {
      const a = k.a, b = k.b, Ja = esc(JSON.stringify(a)), Jb = esc(JSON.stringify(b));
      inner = a && b ? `<div class="tm" onclick='saveResult(${J},{a:${Ja},b:${Jb},winner:${Ja}})' title="click the winner"><span>${tname(a)}</span></div>
          <div class="tm" onclick='saveResult(${J},{a:${Ja},b:${Jb},winner:${Jb}})' title="click the winner"><span>${tname(b)}</span></div>`
        : `<div class="tm tbd"><span>${esc(a || k.srcA)}</span></div><div class="tm tbd"><span>${esc(b || k.srcB)}</span></div>`;
    }
    return `<div class="km"><div class="lb">${KO_NAME[id]}</div>${inner}</div>`;
  };
  $("mbd").innerHTML = (fx.swissDone ? "" : `<div class="mut" style="margin-bottom:8px">The Swiss stage isn't finished: the quarter-finals open once every team has 3 wins or 3 losses.</div>`)
    + `<div class="ko">` + KO_COLS.map(([n, ids]) => `<div class="kwrap"><h3>${n}</h3><div class="kcol">${ids.map(box).join("")}</div></div>`).join("") + `</div>`;
  $("mft").innerHTML = `<span class="mut" style="margin-right:auto">Quarter-finals: pick the two teams from their record pools, then the winner's side. Later rounds: click the winner.</span><button onclick="closeModal()">Close</button>`;
}
function koPick(btn, id, side) {
  const k = btn.closest(".km"), a = k.querySelector(".ka").value, b = k.querySelector(".kb").value;
  if (!a || !b || a === b) return toast("pick two different teams");
  saveResult(id, {a, b, winner: side === "a" ? a : b});
}
// settings: everything that isn't needed minute to minute
const SETS = [["fatPct", "fat-finger guard: typed bids / offers within this share of fair (0.3 = 30%) …", 0.05],
  ["fatMin", "… or this many points of it, whichever is wider", 0.5],
  ["startWidth", "width right after a result", 1], ["narrowSecs", "seconds to narrow to the MM spread", 30],
  ["k","non-MM markets narrow to 2 × (k × σ(next result)", 0.1], ["c", "… + c)", 0.1],
  ["hardExtra", "hard limit = max + this (free-money takes)", 1], ["budget", "max budget (worst-case loss)", 100],
  ["takeEdge", "take a price this far through our PA", 0.1], ["takeMax", "take: max lots", 1]];
function openSettings() { MTAB = "settings"; showModal(); }
function modalSettings() {
  const c = S.controls;
  $("mbd").innerHTML = `<div class="sets">` + SETS.map(([k, l, s]) => `<label>${l}</label><input type="number" step="${s}" value="${c[k]}" onchange="setCtl({${k}:+this.value})">`).join("")
    + `<label>take crossing prices</label><input type="checkbox" ${c.take ? "checked" : ""} onchange="setCtl({take:this.checked})">`
    + `<label>start wide again</label><div><button onclick="setCtl({wideSince:Date.now()/1000}).then(()=>toast('every market back to the start width, narrowing again'))">re-widen now</button></div>`
    + `<label>theo / PA edits</label><div><button onclick="setCtl({theoAdj:{},paAdj:{}}).then(()=>toast('all theo and PA edits cleared'))">clear all edits</button></div>`
    + `<label>contract mapping</label><div class="${S.mappingProblems.length ? "neg" : "pos"}">${S.mappingProblems.length ? esc(S.mappingProblems.join("; ")) : "OK"}</div>`
    + `<label>model</label><div class="mut">${S.simMs} ms per re-price</div></div>`;
  $("mft").innerHTML = `<button onclick="closeModal()">Close</button>`;
}
addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });

// --- polling ---
async function refresh() {
  try { const j = await (await fetch("/api/state", {headers: {"X-Trade-Token": TOKEN}})).json(); if (j.error && !j.rows) { $("err").textContent = j.error; return; } S = j; render(); }
  catch (e) { $("err").textContent = "desk server not reachable"; }
}
refresh(); setInterval(refresh, 500);
setInterval(() => { if (TAB === "mk" && Object.values(CHART).some(Boolean)) fetchHist(); }, 2000);
addEventListener("resize", () => render());
</script>
